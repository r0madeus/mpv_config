# uosc menüsü
mbtn_right  script-binding uosc/menu
menu        script-binding uosc/menu

# Panodaki bağlantıyı ya da dosya yolunu aç (YouTube dahil)
ctrl+v      loadfile "${clipboard/text}"; show-text "Açılıyor: ${clipboard/text}"

# Ses dengeleme aç/kapat (canlı yayınlarda dalgalanan ses için)
n           af toggle @dengele:dynaudnorm=f=250:g=31:p=0.9:m=8; show-text "Ses dengeleme: ${?=af==:kapalı}${!=af==:açık}"

# Türkçe Q klavye: ABD [ ] tuşlarının yerindeki ğ ü ile hız
ğ           multiply speed 1/1.1
ü           multiply speed 1.1
