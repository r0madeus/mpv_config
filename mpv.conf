# mpv yapılandırması (mpv 0.41, uosc + thumbfast)
# Pildeyken [pil] profili scripts/pil-profili.lua tarafından otomatik uygulanır.

# --- Arayüz (uosc) ---
osc=no
osd-bar=no
border=no
window-corners=round
autofit-larger=90%x90%
keep-open=yes
volume-max=150
osd-font="Roboto"

# --- Görüntü ---
vo=gpu-next
hwdec=auto-safe
deband=yes

# --- Son yerden devam (yalnız konum) ---
save-position-on-quit=yes
watch-later-options=start

# --- Klasördeki diğer dosyaları sıraya al (autoload yerine yerleşik) ---
autocreate-playlist=filter
directory-filter-types=video,audio

# --- Dil ve altyazı ---
alang=tr,tur,en,eng
slang=tr,tur,en,eng
sub-auto=fuzzy
sub-font="Segoe UI Semibold"
sub-font-size=40
sub-border-size=2.5

# --- Ekran görüntüsü ---
screenshot-dir=~/Pictures/mpv
screenshot-format=png
screenshot-template="%F-%wH.%wM.%wS"

# --- YouTube (yt-dlp) ---
# AV1 bu makinede donanımla çözülmüyor; VP9/H.264 tercih edilir.
ytdl-format=bv*[height<=1080][vcodec!^=av01]+ba/b[height<=1080]/bv*+ba/b
ytdl-raw-options=js-runtimes=node

[pil]
profile-desc=Pildeyken hafif ayarlar
profile-restore=copy-equal
profile=fast
deband=no
ytdl-format=bv*[height<=720][vcodec!^=av01]+ba/b[height<=720]/bv*+ba/b
